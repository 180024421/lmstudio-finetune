name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install -U pip
          pip install pyyaml rich pytest datasets
      - name: Validate example config
        run: python validate_config.py --config config.example.yaml
      - name: Run tests
        run: pytest tests/ -q
